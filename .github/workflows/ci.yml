name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq strace
      - run: npm test
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build proofs
        working-directory: formal
        run: lake build
      - name: Challenge file is frozen
        working-directory: formal
        run: echo "99f09a10abfdc1a8ddcb0e4da37dcf5130d39d4775a8629d3f3b76d8b40900a6  Challenge.lean" | sha256sum -c -
      - name: No sorry, no extra axioms
        working-directory: formal
        run: |
          ! grep -rn --include=*.lean -E '\bsorry\b|\badmit\b|native_decide' Testonce Testonce.lean Challenge.lean
          printf 'import Testonce\n#print axioms Testonce.Bloom.no_false_negative\n#print axioms Testonce.Skip.skip_sound\n#print axioms Testonce.Skip.audit_mismatch\n' > /tmp/axioms.lean
          LEAN_PATH=.lake/build/lib/lean lean /tmp/axioms.lean | tee /tmp/axioms.out
          ! grep -E 'sorryAx|Classical.choice|ofReduce' /tmp/axioms.out
