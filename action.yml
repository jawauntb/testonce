name: testonce
description: Skip tests that already passed on byte-identical inputs. Restores and saves the result cache, and makes sure strace is installed.
branding: { icon: fast-forward, color: purple }
inputs:
  cache-dir:
    description: Where results live (relative to the workspace).
    default: .testonce
runs:
  using: composite
  steps:
    - name: Install strace
      shell: bash
      run: command -v strace >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq strace)
    - name: Restore results
      uses: actions/cache@v4
      with:
        path: ${{ inputs.cache-dir }}
        # A new key every run so the updated cache is always saved; restore-keys picks up the latest.
        key: testonce-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          testonce-${{ runner.os }}-${{ github.ref_name }}-
          testonce-${{ runner.os }}-${{ github.event.repository.default_branch }}-
          testonce-${{ runner.os }}-
    - name: Put testonce on PATH
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/bin/testonce.mjs"
        ln -sf "${{ github.action_path }}/bin/testonce.mjs" "${{ github.action_path }}/bin/testonce"
        echo "${{ github.action_path }}/bin" >> "$GITHUB_PATH"
        echo "TESTONCE_CACHE_DIR=${{ github.workspace }}/${{ inputs.cache-dir }}" >> "$GITHUB_ENV"
